<!-- Tracking 레포트 작성/수정 모달 -->
<div id="tracking-report-modal" class="modal-overlay" style="display: none; z-index: 20010;">
    <div class="modal-window tracking-report-window">
        <div class="modal-header">
            <h3 id="tracking-report-title">Tracking 레포트</h3>
            <button type="button" class="btn-del-sm" id="btn-tracking-report-close">✕</button>
        </div>
        <div class="modal-body tracking-report-body">
            <div class="tracking-report-section-title">기본 정보 <span class="tracking-report-hint">작업 이력에서 자동 입력</span></div>
            <div class="tracking-report-basic" id="tracking-report-basic"></div>

            <div class="tracking-report-section-title">레포트 내용</div>
            <div class="tracking-report-fields">
                <!-- 레포트 내용: 왼쪽 초기 이슈 상황 / 오른쪽 최종 확인 상황 (모바일은 위아래) -->
                <div class="tracking-report-split" id="tracking-report-split">
                    <div class="tracking-report-col">
                        <div class="tracking-report-col-title">초기 이슈 상황</div>
                        <label class="tracking-report-field">
                            <span>증상</span>
                            <textarea id="tracking-report-symptom" class="input-dark" rows="3" placeholder="현재 장비 증상, 발생 상황"></textarea>
                        </label>
                        <label class="tracking-report-field">
                            <span>추정 원인</span>
                            <textarea id="tracking-report-cause" class="input-dark" rows="3" placeholder="현재까지 추정되는 원인"></textarea>
                        </label>
                        <label class="tracking-report-field">
                            <span>조치사항</span>
                            <textarea id="tracking-report-action" class="input-dark" rows="3" placeholder="지금까지 진행한 조치 및 향후 조치 계획"></textarea>
                        </label>
                    </div>
                    <div class="tracking-report-col tracking-report-col-final">
                        <div class="tracking-report-col-title">최종 확인 상황 <span class="tracking-report-hint" id="tracking-report-final-meta"></span></div>
                        <label class="tracking-report-field">
                            <span>증상</span>
                            <textarea id="tracking-report-final-symptom" class="input-dark" rows="3" placeholder="최종 확인된 증상"></textarea>
                        </label>
                        <label class="tracking-report-field">
                            <span>최종 원인</span>
                            <textarea id="tracking-report-final-cause" class="input-dark" rows="3" placeholder="최종 확인된 원인"></textarea>
                        </label>
                        <label class="tracking-report-field">
                            <span>최종 조치사항</span>
                            <textarea id="tracking-report-final-action" class="input-dark" rows="3" placeholder="정상화를 위해 최종 진행한 조치"></textarea>
                        </label>
                    </div>
                </div>
                <div class="tracking-report-field">
                    <span>필요물품 <span class="tracking-report-hint">물품 관리에 등록된 항목에서 선택</span></span>
                    <div class="tracking-parts-picker">
                        <div class="tracking-parts-combo">
                            <input type="text" id="tracking-parts-input" class="input-dark" placeholder="물품 선택 또는 검색 (코드명, 물품명, 규격, 품번)" autocomplete="off">
                            <ul id="tracking-parts-list" class="tracking-parts-list" hidden></ul>
                        </div>
                        <input type="number" id="tracking-parts-qty" class="input-dark" value="1" min="1" max="9999" title="수량">
                        <button type="button" class="btn-blue-sm" id="btn-tracking-parts-add">추가</button>
                    </div>
                    <table class="tracking-parts-table" id="tracking-parts-table">
                        <thead>
                            <tr><th style="width: 36px;">No</th><th style="width: 22%;">코드명</th><th>물품명</th><th style="width: 22%;">세부 규격</th><th style="width: 14%;">품번</th><th style="width: 70px;">수량</th><th style="width: 40px;"></th></tr>
                        </thead>
                        <tbody id="tracking-parts-tbody"></tbody>
                    </table>
                </div>
                <div class="tracking-report-field">
                    <span>협의 사항</span>
                    <div class="tracking-discussion-person">
                        <label for="tracking-report-discussion-person">담당자</label>
                        <input type="text" id="tracking-report-discussion-person" class="input-dark" maxlength="100" placeholder="협의 담당자 (예: 고객사 홍길동 프로)" autocomplete="off">
                        <label for="tracking-report-due-date">조치 예정일</label>
                        <input type="date" id="tracking-report-due-date" class="input-dark" max="9999-12-31">
                    </div>
                    <textarea id="tracking-report-discussion" class="input-dark" rows="2" placeholder="고객사·내부 협의 내용, 일정 협의 등"></textarea>
                </div>
            </div>
            <div class="tracking-report-meta" id="tracking-report-meta"></div>
        </div>
        <div class="modal-footer tracking-report-footer">
            <button type="button" class="btn-blue-sm" id="btn-tracking-report-pdf" title="입력 내용을 저장한 뒤 PDF로 출력">PDF 출력</button>
            <button type="button" class="btn-blue-sm" id="btn-tracking-report-copy" title="입력 내용을 저장한 뒤 PDF와 같은 형식의 이미지로 클립보드에 복사">이미지 복사</button>
            <div style="flex: 1;"></div>
            <button type="button" class="btn-gray-sm" id="btn-tracking-report-cancel">취소</button>
            <button type="button" class="btn-green-sm" id="btn-tracking-report-save">저장</button>
            <button type="button" class="btn-tracking-close" id="btn-tracking-report-close-work" style="display: none;" title="레포트를 저장한 뒤 최종 증상/원인/조치사항을 입력하고 정상화 완료 처리">정상화 완료</button>
        </div>
    </div>
</div>
