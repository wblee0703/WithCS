<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WITHTECH - EQ System{% endblock %}</title>
    
    <!-- 공통 CSS -->
    <link rel="stylesheet" href="{{ url_for('SettingDAO', filename='StyleSheet/common.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Noto+Sans+KR:wght@100;300;500;700&display=swap" rel="stylesheet">
    
    <!-- 페이지별 추가 CSS -->
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 1. 공통 헤더 (Header) -->
    <header class="header">
        <!-- 모바일 햄버거 메뉴 -->
        <button class="hamburger-menu" id="hamburger-menu">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </button>

        <img src="{{ url_for('SettingDAO', filename='LOGO+WITHTECH.png') }}" alt="WITHTECH Logo" class="header-logo">
        
        <div class="container">
            <nav>
                <ul class="nav-links">
                    <li><a href="{{ url_for('home') }}" class="{% if active_page == 'home' %}active{% endif %}">HOME</a></li>
                    <li><a href="{{ url_for('setup') }}" class="{% if active_page == 'setup' %}active{% endif %}">SETUP</a></li>
                    <li><a href="{{ url_for('maintenance') }}" class="{% if active_page == 'maintenance' %}active{% endif %}">MAINT</a></li>
                    {% if session.get('role') == 'admin' %}
                    <li><a href="{{ url_for('admin') }}" class="{% if active_page == 'admin' %}active{% endif %}">ADMIN</a></li>
                    {% endif %}
                </ul>
            </nav>
        </div>

        <!-- 모바일 네비게이션 패널 -->
        <div class="nav-overlay" id="nav-overlay"></div>
        <nav class="mobile-nav" id="mobile-nav"></nav>

        <div class="user-controls">
            <span id="user-info" class="user-info" style="display: none;"></span>
            <button id="btn-login-logout" class="btn-gray">로그인</button>
            <button id="btn-user-settings" class="btn-gray" style="display: none;">⚙️ 설정</button>
        </div>
    </header>

    <!-- 2. 메인 컨텐츠 블록 (페이지별 내용이 여기에 들어감) -->
    {% block content %}{% endblock %}

    <!-- 3. 공통 모달 팝업 (Common Modals) -->
    
    <!-- 시스템 로그 모달 -->
    <div id="log-modal" class="modal-overlay" style="display: none;">
        <div class="modal-window">
            <div class="modal-header">
                <h3>시스템 로그</h3>
                <button class="btn-del-sm" id="btn-close-modal">✕</button>
            </div>
            <div class="log-filter-bar">
                <button class="btn-filter active" data-filter="all">전체</button>
                <button class="btn-filter" data-filter="common">공통</button>
                <button class="btn-filter" data-filter="setup">장비셋업</button>
                <button class="btn-filter" data-filter="maint">운영관리</button>
            </div>
            <div class="modal-body">
                <div class="data-table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 180px;">시간</th>
                                <th style="width: 150px;">행동</th>
                                <th style="width: 150px;">대상</th>
                                <th>상세</th>
                            </tr>
                        </thead>
                        <tbody id="system-log-body"></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-gray" id="btn-clear-logs">로그 비우기</button>
            </div>
        </div>
    </div>

    <!-- 로그인 모달 (세션 만료/재로그인용) -->
    <div id="login-modal" class="modal-overlay" style="display: none;">
        <div class="modal-window" style="width: 400px; height: auto;">
            <div class="modal-header">
                <h3>로그인</h3>
            </div>
            <div class="modal-body">
                <div class="login-form">
                    <input type="text" id="login-id" placeholder="아이디 (admin)">
                    <input type="password" id="login-pw" placeholder="비밀번호 (1234)">
                    <button class="btn-blue" id="btn-login-submit">로그인</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 사용자 설정 모달 -->
    <div id="user-modal" class="modal-overlay" style="display: none;">
        <div class="modal-window size-user">
            <div class="modal-header">
                <h3>계정 관리</h3>
                <button class="btn-del-sm" id="btn-close-user-modal">✕</button>
            </div>
            <div class="modal-body">
                <div class="sidebar-group" id="admin-panel" style="display: none; margin-bottom: 20px;">
                    <h4 class="modal-section-title modal-section-title-blue">계정 추가 (관리자 전용)</h4>
                    <div class="form-row">
                        <input type="text" id="new-user-id" placeholder="아이디">
                        <input type="password" id="new-user-pw" placeholder="비밀번호">
                        <select id="new-user-role" class="modal-select">
                            <option value="user">일반</option>
                            <option value="admin">관리자</option>
                        </select>
                        <button class="btn-add" id="btn-add-user">+</button>
                    </div>
                    <button id="btn-github-sync" class="btn-green" style="width: 100%; margin-top: 10px;">GitHub 전체 동기화</button>
                </div>
                <h4 class="modal-section-title modal-section-title-blue">비밀번호 변경</h4>
                <div class="form-row">
                    <input type="password" id="change-pw-current" placeholder="현재 비밀번호">
                    <input type="password" id="change-pw-new" placeholder="새 비밀번호">
                    <button class="btn-blue" id="btn-change-pw">변경</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. 스크립트 (Scripts) -->
    <script src="{{ url_for('SettingDAO', filename='JavaScript/common.js') }}"></script>
    <!-- 페이지별 추가 스크립트 -->
    {% block extra_js %}{% endblock %}
</body>
</html>
